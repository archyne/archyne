name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # `measureNode` works out a node's box from padding, floors and type sizes
      # that `src/styles.css` also states. They are extracted rather than
      # copied, and this fails if the stylesheet has moved on without them —
      # which would otherwise be silent until a diagram looked wrong.
      - name: Box model matches the stylesheet
        run: npm run boxmodel:check

      # Weight is most of what "easy to import" means, and the shape matters
      # more than the number: this fails if the renderer's import graph ever
      # reaches React, xyflow, zustand or Mermaid, which would make it an
      # application again rather than a library.
      - name: Renderer stays small and first-party
        run: npm run size:render

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run size

      - name: MCP server smoke test
        run: npm run mcp:smoke

      - name: Third-party notices are up to date
        run: npm run notices:check

      # Plain Node, no install: the extension's own dependencies are not
      # needed to compare two numbers, and this has to fail on a release that
      # bumped the app and forgot the extension.
      - name: VS Code extension version follows the app
        run: node extensions/vscode/scripts/sync-version.mjs --check

      - name: Renderer package version follows the app
        run: node packages/render/scripts/sync-version.mjs --check

      # Builds `archyne-render` from `src/render/`, then packs it, installs the
      # tarball into a temporary directory outside the tree and imports it by
      # name. That is the only place an `exports` map naming a missing file, or
      # a devDependency that was really a dependency, can fail — inside the
      # repository every path resolves. The build itself refuses to produce a
      # bundle containing React, xyflow, Zustand or the Iconify collections,
      # each of which has been in it at least once.
      - name: Renderer package is consumable
        run: |
          node packages/render/scripts/build.mjs
          node packages/render/scripts/smoke.mjs

      # Production dependencies only, gated at high/critical, with written
      # exceptions in audit-allow.json — see scripts/audit-gate.mjs.
      - name: Dependency advisories
        run: npm run audit

  # The browser-driven suites. These were previously run by hand against a
  # local dev server in Edge, so they only caught regressions when someone
  # remembered to look; nothing here is covered by the jsdom unit tests —
  # export rasterization, WCAG contrast and target size, RTL geometry, and
  # the sanitizer/CSP checks all need real layout and a real browser.
  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # tests/e2e-i18n-export.mts measures rendered ink for Japanese, Korean,
      # Arabic and Cyrillic labels. Without these fonts the glyphs are missing
      # on the runner rather than in the app, and the test would report a
      # regression that does not exist.
      - name: Install fonts for the non-Latin export check
        run: sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-cjk

      - name: Start dev server
        run: |
          nohup npm run dev -- --port 5173 --strictPort > dev-server.log 2>&1 &
          timeout 90 bash -c 'until curl -sfo /dev/null http://localhost:5173; do sleep 1; done'

      # The export suites drive `window.__graphTest`, which App.tsx exposes
      # only under `import.meta.env.DEV` — deliberately, so the store and the
      # export internals are not reachable from the shipped bundle. That is
      # why these run against the dev server.
      - name: Export pipeline
        run: npm run test:e2e:export
        env:
          ARCHYNE_URL: http://localhost:5173

      - name: Non-Latin label export
        run: npm run test:e2e:i18n
        env:
          ARCHYNE_URL: http://localhost:5173

      - name: Right-to-left chrome
        run: npm run test:e2e:rtl
        env:
          ARCHYNE_URL: http://localhost:5173

      - name: Alignment guides
        run: npm run test:e2e:drag
        env:
          ARCHYNE_URL: http://localhost:5173

      - name: Edge routing
        run: npm run test:e2e:waypoints
        env:
          ARCHYNE_URL: http://localhost:5173

      - name: Sequence message order
        run: npm run test:e2e:sequence
        env:
          ARCHYNE_URL: http://localhost:5173

      - name: Architecture layout
        run: npm run test:e2e:architecture
        env:
          ARCHYNE_URL: http://localhost:5173

      - name: Node resizing
        run: npm run test:e2e:resize
        env:
          ARCHYNE_URL: http://localhost:5173

      # `measureNode` works out a node's box without a browser, from constants
      # copied by hand out of `src/styles.css`. A copied constant is wrong the
      # moment somebody edits the original, and nothing else would notice —
      # the editor re-measures every node a frame later and papers over it.
      # This compares the two where both answers exist.
      - name: Node measurement matches the browser
        run: npm run test:e2e:measure
        env:
          ARCHYNE_URL: http://localhost:5173

      # Deliberately without `ARCHYNE_URL`: this one never opens the app. It
      # builds an SVG string in Node, writes it to a file, and asks a browser
      # to open that file cold — which is the whole claim behind the renderer,
      # and would be untested by anything that went through the dev server.
      - name: A rendered SVG stands on its own
        run: npm run test:e2e:render

      # `src/widthTable.generated.ts` is a measurement of fonts, committed, and
      # a committed measurement goes stale silently — the editor re-measures a
      # frame later and papers over it, so only a pre-rendered file would show
      # the damage. The generator's own `--check` cannot run here (this runner
      # has neither Segoe UI nor Cascadia Code); this asks the runner what *it*
      # would paint and compares, which is a question any machine can answer
      # about itself. It knows which regime it is in and says so.
      - name: The browser-free measurement holds up
        run: npm run test:e2e:metrics

      # The package README tells a reader how to plug the renderer into their
      # Markdown preview, their build step, or their file watcher. Instructions
      # rot silently — the API moves, the snippet stops working, and nobody
      # finds out until somebody has wasted an afternoon on it. This extracts
      # those exact blocks from the README and runs them, against the packed
      # tarball installed by name, outside the tree. It has already earned its
      # keep: the webview recipe could not be bundled as written.
      - name: Every recipe in the README runs
        run: npm run test:e2e:recipes

      # `test:e2e:measure` pins the geometry the canvas and the emitter agree
      # on; this pins the paint, which is where four defects got through a
      # green suite — a `fill` attribute the document's own `<style>` beat, a
      # `classDef` never read, `style` statements ignored by three families,
      # and labels in a `<foreignObject>` that nothing paints. Each was
      # invisible to an assertion about a string, so both pictures are read
      # here with `getComputedStyle` instead, in the same browser.
      - name: The canvas and the emitter paint the same colours
        run: npm run test:e2e:paint
        env:
          ARCHYNE_URL: http://localhost:5173

      # The router and the label placer have unit tests, and those check the
      # rules on cases written to exercise them. This checks the thing the
      # rules exist for, on every diagram the repo ships: that nothing a
      # reader needs — an arrowhead, a box's words, a label, a whole
      # connection — ends up underneath something else.
      - name: Nothing important is hidden under anything else
        run: npm run test:e2e:legibility
        env:
          ARCHYNE_URL: http://localhost:5173

      # Taking hold of a connection and pulling it sideways, on every run of
      # every connection in a real import. Three separate faults have made
      # that gesture come back as a line folded over itself, and none of them
      # showed on a diagram small enough to write out by hand.
      - name: Dragging a connection moves it and nothing else
        run: npm run test:e2e:slide
        env:
          ARCHYNE_URL: http://localhost:5173

      - name: Side panel and editor
        run: npm run test:e2e:panel
        env:
          ARCHYNE_URL: http://localhost:5173

      - name: Icon picking
        run: npm run test:e2e:icons
        env:
          ARCHYNE_URL: http://localhost:5173

      - name: Disk watching
        run: npm run test:e2e:watch
        env:
          ARCHYNE_URL: http://localhost:5173

      - name: Diagram import (draw.io, Graphviz)
        run: npm run test:e2e:import
        env:
          ARCHYNE_URL: http://localhost:5173

      - name: Accessibility (WCAG 2.2 AA)
        run: npm run test:e2e:a11y
        env:
          ARCHYNE_URL: http://localhost:5173

      # Run the security suite against the *built* app as well: it needs no
      # dev-only hooks, so it can check that the artifact users actually get
      # boots, renders, and enforces its own policy.
      - name: Build and serve the production bundle
        run: |
          npm run build
          nohup npm run preview -- --port 4173 --strictPort > preview-server.log 2>&1 &
          timeout 90 bash -c 'until curl -sfo /dev/null http://localhost:4173; do sleep 1; done'

      - name: Sanitizer and CSP
        run: npm run test:e2e:csp
        env:
          ARCHYNE_URL: http://localhost:4173

      # Exports are judged by pixels, so the images are the evidence.
      - name: Upload rendered output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-output
          path: |
            export-e2e.png
            export-e2e-*.pdf
            import-e2e-*.png
            e2e-out/
            dev-server.log
            preview-server.log
          if-no-files-found: ignore
          retention-days: 7

  # The editor must also build and typecheck on the platform most desktop
  # users are on; electron-builder is Windows-first today.
  windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
