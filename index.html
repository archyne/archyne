<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Archyne makes no network requests on its own account: everything it
      needs — the icon packs, mermaid's renderers — is bundled, and nothing
      here calls home.

      `connect-src` names the hosts behind two opt-in features, and nothing
      else. Importing an icon from a pasted link fetches loose vendor files:
      four raw-file hosts that serve with permissive CORS, plus Iconify's API,
      which is how ~200 000 icons are reachable without the build carrying
      them — that list is kept in step with `ICON_HOSTS` in
      src/model/iconUrl.ts, which a test checks. And running the local model
      (the Generate panel's own feature) fetches its ONNX weights from
      huggingface.co, which redirects large files to its CDNs — the legacy
      LFS hosts and `*.cdn.hf.co`, the aws/eu/ap "xet" locations a repo
      actually resolves the redirect to. These are reached only when a person
      sends a prompt, never on their own.
      It must never become `*` or bare `https:`: a request only ever goes out
      because somebody pasted a link and pressed a button.

      Notes on the loosenings:
        style-src 'unsafe-inline'  mermaid injects a <style> per render, and
                                   the splash below is inline on purpose
        script-src blob:           onnxruntime-web (the local model's WASM
                                   backend) bootstraps its execution worker
                                   from a blob URL; worker-src 'self' blob:
                                   already admits the worker itself, and this
                                   admits the single script that starts it
        script-src 'wasm-unsafe-eval'  onnxruntime-web compiles the model's
                                   WASM kernels; this is the narrow token that
                                   lets WebAssembly.instantiate run without
                                   granting eval, whose own token stays absent
        img-src data: blob:        exports are produced as data URLs, and the
                                   preview rasterizes SVG through blobs; the
                                   same five hosts as `connect-src`, because
                                   mermaid's image shape draws a node from a
                                   URL and that URL is the point of it
        font-src data:             html-to-image inlines fonts as data URLs

      `frame-ancestors` is deliberately absent: it is ignored in a meta tag,
      and Archyne supports being embedded. Operators who want to restrict who
      may frame their deployment should send it as an HTTP header — see the
      self-hosting notes in CONTRIBUTING.md.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' blob: 'wasm-unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https://raw.githubusercontent.com https://gist.githubusercontent.com https://cdn.jsdelivr.net https://unpkg.com https://api.iconify.design;
        font-src 'self' data:;
        connect-src 'self' https://raw.githubusercontent.com https://gist.githubusercontent.com https://cdn.jsdelivr.net https://unpkg.com https://api.iconify.design https://huggingface.co https://cdn.huggingface.co https://cdn-lfs.huggingface.co https://*.cdn.hf.co;
        worker-src 'self' blob:;
        object-src 'none';
        base-uri 'none';
        form-action 'none'
      "
    />
    <!-- SVG where supported; the raster stays for engines that ignore it. -->
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="alternate icon" type="image/png" href="./logo.png" />
    <title>Archyne — a visual editor for Mermaid diagrams</title>

    <!--
      What a search engine and a pasted link have to go on. Without these the
      demo shared into a chat is a bare URL with the filename under it.

      The absolute URLs name the canonical deployment on purpose: a crawler
      resolves `og:image` against nothing, so a relative path gives no card at
      all. A self-hosted copy should point them at its own origin or drop
      them — they describe where this build is published, not where it runs.
    -->
    <meta
      name="description"
      content="Draw diagrams on a canvas and get Mermaid code, or edit the code and watch the canvas follow. Seven diagram families, import from draw.io, Visio, PlantUML and DOT, PNG/SVG/PDF export. Runs entirely on your machine — no server, no accounts."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Archyne — a visual editor for Mermaid diagrams" />
    <meta
      property="og:description"
      content="Draw on a canvas, get Mermaid code — and edit either side. Local-first: no server, no accounts, nothing leaves your machine."
    />
    <meta property="og:url" content="https://archyne.github.io/archyne/" />
    <meta property="og:image" content="https://archyne.github.io/archyne/preview.png" />
    <meta
      property="og:image:alt"
      content="Archyne editing a flowchart: shape palette on the left, canvas in the middle, Mermaid source on the right"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* static splash, shown until React mounts (styles inline on purpose) */
      #root:empty::after {
        content: "";
      }
      .splash {
        position: fixed;
        inset: 0;
        z-index: 3000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0f1014;
        color: #ebebf0;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .splash-mark {
        width: 92px;
        height: 92px;
        animation: splash-bob 1.6s ease-in-out infinite;
      }
      .splash-name {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .splash-sub {
        font-size: 12px;
        color: #999ba8;
      }
      /* The bob is decoration; respect the OS setting. */
      @media (prefers-reduced-motion: reduce) {
        .splash-mark {
          animation: none;
        }
      }
      @keyframes splash-bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash">
        <img class="splash-mark" src="./logo.svg" alt="" />
        <div class="splash-name">Archyne</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
